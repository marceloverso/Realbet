
name: Ejecutar Script de Apuestas

on:
  push:
    branches: [ "main" ]  # Se ejecuta cada vez que subes cambios a la rama main
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías (opcional)
        # Si tienes un archivo requirements.txt dentro de 'apuestas', descomenta la siguiente línea:
        # run: pip install -r apuestas/requirements.txt
        run: pip install pandas  # Por ejemplo, si usas pandas para el CSV

      - name: Ejecutar script
        # Usamos working-directory para que el script se ejecute "dentro" de la carpeta apuestas
        working-directory: ./apuestas_modelo
        run: python main.py
